  <style>
    :root{--navy:#102c49;--green:#0e8d67;--bg:#f3f7fa;--line:#dbe5ec;--text:#17283d;--muted:#6e7e91}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;display:grid;place-items:center;padding:24px}
    .wrap{width:min(920px,100%)}.brand{display:flex;align-items:center;gap:13px;margin-bottom:26px}.cube{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#24c49a,#087352);color:#fff;display:grid;place-items:center;font-size:25px;font-weight:900;box-shadow:0 12px 30px #0d8b672c}

    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 15px 35px rgba(16,44,73,.07);text-decoration:none;color:inherit;transition:.18s}.card:hover{transform:translateY(-3px);box-shadow:0 20px 44px rgba(16,44,73,.12)}.icon{font-size:30px;margin-bottom:17px}.card h2{font-size:19px;margin:0 0 8px}.card p{font-size:13px;line-height:1.65;color:var(--muted);margin:0}.footer{font-size:11px;color:#8a98a8;margin-top:22px;text-align:center}
    @media(max-width:720px){h1{font-size:28px}.grid{grid-template-columns:1fr}.card{padding:20px}}
  </style>
</head>
